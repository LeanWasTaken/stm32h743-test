[env:weact_mini_h743vitx]
platform = ststm32
board = weact_mini_h743vitx
framework = arduino
upload_protocol = dfu

build_flags =
    -DUSBCON
    -DUSBD_USE_CDC
    -DHAL_PCD_MODULE_ENABLED
    '-DUSB_PRODUCT_STRING="STM32H743 Test"'
    '-DUSB_MANUFACTURER_STRING="WeAct Studio"'
    -Ilib/usb_msc/src

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
